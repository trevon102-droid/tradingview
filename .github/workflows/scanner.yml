# Runs the scanner on GitHub's runners on a schedule, so your machine doesn't need to be on.
# Needs repo secret DISCORD_WEBHOOK_URL (and/or TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID).
# Alert memory (scanner/.state.json) and the live research event log (data/research/events/live/*.jsonl)
# live on their own `scanner-state` branch, force-updated each run. If the state is ever lost, only setups
# from the last few bars can re-alert; the event log is append-only and restored before every scan.
name: OF scanner

on:
  schedule:
    - cron: "7 */2 * * 0-5"   # every 2h, Sun–Fri (UTC). Futures/FX week.
  workflow_dispatch:

permissions:
  contents: write   # to save alert state to the scanner-state branch

concurrency:
  group: of-scanner  # never two runs racing on the same state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # a normal run takes ~1 min; fail loudly (with logs) instead of hanging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Load alert state
        run: |
          if git fetch --depth=1 origin scanner-state 2>/dev/null; then
            git show FETCH_HEAD:state.json > scanner/.state.json
            echo "loaded $(python -c 'import json;print(len(json.load(open("scanner/.state.json"))))') keys"
            mkdir -p data/research/events/live
            for f in $(git ls-tree --name-only FETCH_HEAD events/ 2>/dev/null); do
              git show "FETCH_HEAD:$f" > "data/research/events/live/$(basename "$f")"
            done
            echo "restored $(ls data/research/events/live | wc -l) live event files"
          else
            echo "no saved state yet"
          fi

      - name: Scan
        run: python -u -m scanner.scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save alert state
        if: always() && hashFiles('scanner/.state.json') != ''
        run: |
          git config user.name "of-scanner"
          git config user.email "of-scanner@users.noreply.github.com"
          entries=$(printf '100644 blob %s\tstate.json\n' "$(git hash-object -w scanner/.state.json)")
          if ls data/research/events/live/*.jsonl >/dev/null 2>&1; then
            sub=$(for f in data/research/events/live/*.jsonl; do
                    printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"; done | git mktree)
            entries="$entries"$'\n'"$(printf '040000 tree %s\tevents' "$sub")"
          fi
          tree=$(printf '%s\n' "$entries" | git mktree)
          commit=$(git commit-tree "$tree" -m "scanner state $(date -u +%FT%TZ)")
          git push --force origin "$commit:refs/heads/scanner-state"
