# Downloads a frozen snapshot of real NQ/MNQ/ES/MES bars (Yahoo) for the event study and
# publishes it to the `research-data` branch. Analysis runs locally against that snapshot.
name: Research data snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - research/fetch_data.py
      - .github/workflows/research-data.yml

permissions:
  contents: write

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "yfinance>=0.2.50" pandas
      - run: python -m research.fetch_data
      - name: Publish snapshot to research-data branch
        run: |
          git config user.name "of-research"
          git config user.email "of-research@users.noreply.github.com"
          git checkout --orphan snapshot
          git rm -rq --cached .
          git add -f data/market
          git commit -qm "Market data snapshot $(date -u +%FT%TZ)"
          git push --force origin HEAD:refs/heads/research-data
